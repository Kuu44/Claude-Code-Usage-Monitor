name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+crt-static"
  RUST_TARGET: x86_64-pc-windows-msvc
  PACKAGE_NAME: claude-code-usage-monitor
  RELEASE_ASSET_NAME: claude-code-usage-monitor.exe
  CHECKSUM_ASSET_NAME: SHA256SUMS.txt

jobs:
  validate:
    name: Build and validate Windows release
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          target: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Validate tag, package version, and repository
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') {
            throw "Release tag '$env:RELEASE_TAG' is not a stable vSemVer tag. Expected vMAJOR.MINOR.PATCH."
          }

          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed with exit code $LASTEXITCODE."
          }
          $metadata = $metadataJson | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq $env:PACKAGE_NAME } | Select-Object -First 1)
          if ($package.Count -ne 1) {
            throw "Package '$env:PACKAGE_NAME' was not found in cargo metadata."
          }

          $expectedRepository = "https://github.com/$env:GITHUB_REPOSITORY_NAME"
          $actualRepository = ([string]$package[0].repository).TrimEnd('/')
          if ([string]::Compare($actualRepository, $expectedRepository, $true) -ne 0) {
            throw "Cargo repository '$actualRepository' does not match '$expectedRepository'."
          }
          if ([string]$package[0].version -ne $Matches.version) {
            throw "Cargo package version '$($package[0].version)' does not match release tag version '$($Matches.version)'."
          }

          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Check the locked dependency graph
        shell: pwsh
        run: cargo check --locked --target $env:RUST_TARGET

      - name: Run tests
        shell: pwsh
        run: cargo test --locked --target $env:RUST_TARGET --no-fail-fast

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked --target $env:RUST_TARGET

      - name: Stage and validate release artifacts
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null

          $builtExecutable = Join-Path $env:GITHUB_WORKSPACE "target\$env:RUST_TARGET\release\$env:RELEASE_ASSET_NAME"
          if (-not (Test-Path -LiteralPath $builtExecutable -PathType Leaf)) {
            throw "Expected release executable was not produced: $builtExecutable"
          }
          $stagedExecutable = Join-Path $artifactDirectory $env:RELEASE_ASSET_NAME
          Copy-Item -LiteralPath $builtExecutable -Destination $stagedExecutable -Force

          $versionInfo = (Get-Item -LiteralPath $stagedExecutable).VersionInfo
          foreach ($field in @('FileVersion', 'ProductVersion')) {
            $value = [string]$versionInfo.$field
            if (-not $value.StartsWith($env:RELEASE_VERSION, [StringComparison]::Ordinal)) {
              throw "$field '$value' does not begin with release version '$env:RELEASE_VERSION'."
            }
          }
          if ([string]$versionInfo.OriginalFilename -ne $env:RELEASE_ASSET_NAME) {
            throw "OriginalFilename '$($versionInfo.OriginalFilename)' does not match '$env:RELEASE_ASSET_NAME'."
          }

          # A static CRT build must not import the Microsoft runtime DLLs. Scan
          # both common PE string encodings when dumpbin is unavailable.
          $bytes = [IO.File]::ReadAllBytes($stagedExecutable)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [Text.Encoding]::Unicode.GetString($bytes)
          $forbiddenRuntime = '(?i)VCRUNTIME140(?:_1)?\.dll|MSVCP[0-9]+(?:_1)?\.dll'
          if ($ascii -match $forbiddenRuntime -or $unicode -match $forbiddenRuntime) {
            throw 'The executable imports a VCRUNTIME or MSVCP runtime DLL; static CRT validation failed.'
          }

          $hash = (Get-FileHash -LiteralPath $stagedExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$env:RELEASE_ASSET_NAME" | Set-Content -LiteralPath (Join-Path $artifactDirectory $env:CHECKSUM_ASSET_NAME) -Encoding ascii
          Get-ChildItem -LiteralPath $artifactDirectory | Select-Object Name, Length

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: validate
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Download exact release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Verify publication inputs
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath RELEASE_NOTES.md -PathType Leaf)) {
            throw 'RELEASE_NOTES.md is missing from the tagged source.'
          }
          foreach ($asset in @($env:RELEASE_ASSET_NAME, $env:CHECKSUM_ASSET_NAME)) {
            $path = Join-Path 'release-artifacts' $asset
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release asset is missing: $path"
            }
          }

      - name: Create latest GitHub release
        shell: pwsh
        run: |
          $assets = @(
            (Join-Path 'release-artifacts' $env:RELEASE_ASSET_NAME),
            (Join-Path 'release-artifacts' $env:CHECKSUM_ASSET_NAME)
          )
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY_NAME `
            --verify-tag `
            --latest `
            --title "Claude Code Usage Monitor $env:RELEASE_TAG" `
            --notes-file RELEASE_NOTES.md `
            @assets
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }
